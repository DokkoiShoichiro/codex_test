<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19392d">
  <title>うちのレシピ帳</title>
  <link rel="stylesheet" href="styles.css?v=20260928-1">
  <link rel="stylesheet" href="editorial.css?v=20260928-1">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand-row">
      <span class="brand-mark">R</span>
      <span class="brand-name">THE KITCHEN JOURNAL</span><a class="archive-link" href="#archive">レシピを探す <span aria-hidden="true">↗</span></a>
    </div>
    <div class="hero-copy">
      <p class="eyebrow">COOK. TASTE. MAKE IT YOURS.</p>
      <h1>うちの<span>レシピ帳</span><span class="title-dot" aria-hidden="true">.</span></h1>
      <p class="lead">何度も作って、少しずつ育てていく。<br class="sp-only">わが家の味をつくる、小さな記録。</p>
    </div>
    <div class="hero-stats">
      <div><strong id="totalRecipes">–</strong><span>収録レシピ</span></div>
      <div><strong id="ratedRecipes">–</strong><span>レビュー済み</span></div>
      <div><strong id="topRated">–</strong><span>最高評価 / 10</span></div>
    </div>
  </div>
</header>

<main>
  <section class="search-panel" id="archive" aria-label="レシピを探す">
    <div class="search-heading"><span>FIND YOUR NEXT DISH</span><span>今日は、何をつくろう。</span></div>
    <div class="search-main">
      <div class="search-row">
        <label class="search-box">
          <span class="search-icon">⌕</span>
          <input id="q" aria-label="料理名・食材・タグで検索" type="search" placeholder="料理名・食材・タグで検索">
        </label>
        <button id="searchButton" class="search-button" type="button">検索</button>
      </div>
    </div>
    <div class="filters">
      <select id="genre" aria-label="ジャンル"><option value="">ジャンル：すべて</option></select>
      <select id="category" aria-label="料理区分"><option value="">料理区分：すべて</option></select>
      <select id="minutes" aria-label="調理時間">
        <option value="">調理時間：すべて</option>
        <option value="10">10分以内</option>
        <option value="20">20分以内</option>
        <option value="30">30分以内</option>
        <option value="60">60分以内</option>
      </select>
      <select id="rating" aria-label="評価">
        <option value="">評価：すべて</option>
        <option value="8">★8以上</option>
        <option value="9">★9以上</option>
        <option value="10">★10のみ</option>
        <option value="unrated">未評価</option>
      </select>
      <select id="sort" aria-label="並べ替え">
        <option value="title">料理名順</option>
        <option value="rating">評価順</option>
        <option value="minutes">調理時間順</option>
      </select>
    </div>
    <div class="genre-legend" id="genreLegend"></div>
  </section>

  <section class="list-head">
    <div>
      <p class="section-kicker">THE COLLECTION</p>
      <h2>わが家のレパートリー</h2>
    </div>
    <div class="list-actions">
      <span id="count" role="status"></span>
      <button id="clearFilters" type="button">条件をクリア</button>
      <button id="trashButton" type="button">ゴミ箱</button>
    </div>
  </section>

  <section id="recipeList" class="recipe-grid"></section>
</main>

<footer class="site-footer">
  <p>THE KITCHEN JOURNAL <span aria-hidden="true">／</span> うちのレシピ帳</p>
</footer>

<dialog id="recipeDialog" aria-labelledby="recipeTitle">
  <button class="dialog-close" id="closeDialog" aria-label="閉じる">×</button>
  <div id="dialogContent"></div>
</dialog>

<script src="app.js?v=20260928-1"></script>
</body>
</html>
