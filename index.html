<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#19392d">
  <title>うちのレシピ帳</title>
  <link rel="stylesheet" href="styles.css?v=20260927-2">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand-row">
      <span class="brand-mark">R</span>
      <span class="brand-name">RECIPE ARCHIVE</span>
    </div>
    <div class="hero-copy">
      <p class="eyebrow">MY KITCHEN NOTES</p>
      <h1>うちのレシピ帳</h1>
      <p class="lead">何度も作って、少しずつ育てていく。<br class="sp-only">わが家の料理データベース。</p>
    </div>
    <div class="hero-stats">
      <div><strong id="totalRecipes">–</strong><span>RECIPES</span></div>
      <div><strong id="ratedRecipes">–</strong><span>RATED</span></div>
      <div><strong id="topRated">–</strong><span>TOP SCORE</span></div>
    </div>
  </div>
</header>

<main>
  <section class="search-panel">
    <div class="search-main">
      <div class="search-row">
        <label class="search-box">
          <span class="search-icon">⌕</span>
          <input id="q" type="search" placeholder="料理名・食材・タグで検索">
        </label>
        <button id="searchButton" class="search-button" type="button">検索</button>
      </div>
    </div>
    <div class="filters">
      <select id="genre"><option value="">ジャンル：すべて</option></select>
      <select id="category"><option value="">料理区分：すべて</option></select>
      <select id="minutes">
        <option value="">調理時間：すべて</option>
        <option value="10">10分以内</option>
        <option value="20">20分以内</option>
        <option value="30">30分以内</option>
        <option value="60">60分以内</option>
      </select>
      <select id="rating">
        <option value="">評価：すべて</option>
        <option value="8">★8以上</option>
        <option value="9">★9以上</option>
        <option value="10">★10のみ</option>
        <option value="unrated">未評価</option>
      </select>
      <select id="sort">
        <option value="title">料理名順</option>
        <option value="rating">評価順</option>
        <option value="minutes">調理時間順</option>
      </select>
    </div>
    <div class="genre-legend" id="genreLegend"></div>
  </section>

  <section class="list-head">
    <div>
      <p class="section-kicker">ARCHIVE</p>
      <h2>レシピ一覧</h2>
    </div>
    <div class="list-actions">
      <span id="count"></span>
      <button id="clearFilters" type="button">条件をクリア</button>
    </div>
  </section>

  <section id="recipeList" class="recipe-grid"></section>
</main>

<footer class="site-footer">
  <p>Recipe Archive — private kitchen notes</p>
</footer>

<dialog id="recipeDialog" aria-labelledby="recipeTitle">
  <button class="dialog-close" id="closeDialog" aria-label="閉じる">×</button>
  <div id="dialogContent"></div>
</dialog>

<script src="app.js?v=20260927-5"></script>
</body>
</html>
